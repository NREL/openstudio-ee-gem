[pytest]
# Configure pytest to prevent import conflicts between measures
# Each measure's tests should be run in isolation with proper sys.path

# Don't add the current directory to sys.path automatically
addopts = --import-mode=importlib

# Pattern for test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore cache and virtual environments
norecursedirs = .git .venv venv __pycache__ *.egg-info dist build vendor

