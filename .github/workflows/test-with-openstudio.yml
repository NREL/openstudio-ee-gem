# Test with OpenStudio container
name: test_with_openstudio
on: push

jobs:
  test-gems-latest:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      DEPLOY_PATH: ${{ github.repository }}/${{ github.ref_name }}/${{ github.run_number }} # Path for S3 deployment
      S3_BUCKET: ext-gem-dashboard

    steps:
      - name: Login to Docker Hub
        # Authenticate with Docker Hub using repository secrets to access nrel/openstudio:develop
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Ensure this secret exists in your repository or organization settings
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # Ensure this secret exists in your repository or organization settings

      - name: Checkout Repository
        # Checkout the repository to the runner's workspace
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Bundle Dependencies
        # Cache gem dependencies to speed up builds and improve reliability
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Run Tests in OpenStudio Container
        # Run all tests inside the OpenStudio develop container with proper authentication
        run: |
          # Pull the develop image now that we're authenticated
          docker pull nrel/openstudio:develop
          
          # Run the container with all our test commands
          docker run --rm \
            -u root \
            -e "LANG=en_US.UTF-8" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nrel/openstudio:develop \
            bash -c '
              set -e
              
              echo "Starting OpenStudio EE Gem tests..."
              echo "Ruby Version: $(ruby -v)"
              echo "Platform: $(uname -a)"
              echo "OpenStudio Version: $(openstudio openstudio_version)"
              echo "Current working directory: $(pwd)"
              echo "Available memory: $(free -h)" || echo "Memory info not available"
              echo "Disk space: $(df -h .)" || echo "Disk info not available"
              
              # Fix git ownership issue in container
              git config --global --add safe.directory "*"
              
              # Install system dependencies
              echo "Installing Node.js and AWS CLI..."
              apt-get update
              apt-get install -y curl unzip locales
              locale-gen en_US.UTF-8
              
              # Install Node.js
              curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
              apt-get install -y nodejs
              
              # Install AWS CLI v2
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              ./aws/install
              rm -rf awscliv2.zip aws/
              
              # Verify installations
              echo "Node.js version: $(node --version)"
              echo "npm version: $(npm --version)"
              echo "AWS CLI version: $(aws --version)"
              
              # Install gem dependencies with better error handling
              echo "Installing gem dependencies..."
              echo "Ruby version: $(ruby -v)"
              echo "Bundler version: $(bundle -v)"
              
              # Update gem sources to ensure we can reach all repositories
              echo "Current gem sources:"
              gem sources -l
              
              # Update RubyGems if needed
              echo "Updating RubyGems..."
              gem update --system --no-document || echo "Warning: Could not update RubyGems"
              
              # Ensure bundler is up to date
              echo "Ensuring bundler is available..."
              gem install bundler -v 2.4.10 --no-document || echo "Warning: Could not install specific bundler version"
              echo "Final bundler version: $(bundle -v)"
              
              # Configure bundler for better platform support
              bundle config set --local build.nokogiri --use-system-libraries
              bundle config set --local force_ruby_platform true
              bundle config set --local path vendor/bundle
              bundle config set --local deployment false
              
              # Show current bundle configuration
              echo "Bundle configuration:"
              bundle config list
              
              # Try bundle install with verbose output and retries
              echo "Running bundle install..."
              RETRY_COUNT=0
              MAX_RETRIES=3
              
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if bundle install --verbose --retry 3 --jobs 4; then
                  echo "✅ Successfully installed gem dependencies"
                  break
                else
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "⚠️ Bundle install failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 10
                    # Clear bundle cache on retry
                    bundle clean --force || true
                  else
                    echo "::error::Failed to install gem dependencies after $MAX_RETRIES attempts"
                    echo "Final bundle environment:"
                    bundle env
                    echo "Gemfile content:"
                    cat Gemfile
                    echo "Gemfile.lock content (first 50 lines):"
                    head -50 Gemfile.lock
                    echo "Available gems:"
                    gem list
                    echo "Network connectivity test:"
                    curl -I https://rubygems.org/ || echo "Cannot reach rubygems.org"
                    exit 1
                  fi
                fi
              done
              echo "✅ Successfully installed gem dependencies"
              
              # Show environment info
              echo "Bundle Version: $(bundle -v)"
              echo "Bundle Environment:"
              bundle env
              echo "Listing OpenStudio Gems: $(openstudio gem_list)"
              
              # Run test suite
              echo "Running bundler tests..."
              if ! bundle exec rake; then
                echo "::error::Main rake task failed"
                exit 1
              fi
              echo "✅ Main rake task completed successfully"
              
              if ! bundle exec rake openstudio:list_measures; then
                echo "::error::Failed to list measures"
                exit 1
              fi
              echo "✅ Successfully listed measures"
              
              if ! bundle exec rake openstudio:update_measures; then
                echo "::error::Failed to update measures"
                exit 1
              fi
              echo "✅ Successfully updated measures"
              
              if ! bundle exec rake openstudio:test_with_openstudio; then
                echo "::error::Failed to run OpenStudio tests"
                exit 1
              fi
              echo "✅ Successfully completed OpenStudio tests"
              
              # Archive test results (matching original workflow behavior)
              if [ -d "test" ]; then
                mv test test_with_cli_bundler
                echo "Test directory renamed to test_with_cli_bundler"
              fi
              
              # Find and rename test_results directory
              dir_name=$(find . -type d -name "test_results" | head -1)
              if [ -n "$dir_name" ]; then
                mv "$dir_name" test_results_dashboard_cli_bundler
                echo "Found and renamed test_results directory: $dir_name -> test_results_dashboard_cli_bundler"
                ls -al test_results_dashboard_cli_bundler/
              fi
              
              echo "🎉 All tests completed successfully with nrel/openstudio:develop!"
            '

      - name: Configure AWS Credentials
        # Configure AWS credentials for S3 deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Sync files to S3 with branch and build in path
        shell: bash
        run: |
          echo "Deploying to s3://${{ env.S3_BUCKET }}/${{ env.DEPLOY_PATH }}/"
          # Use the renamed test_results directory
          dir_name="test_results_dashboard_cli_bundler"
          if [ -d "$dir_name" ]; then
            echo "TEST_RESULTS_DIR=$dir_name" >> $GITHUB_ENV
            if ! aws s3 sync $dir_name s3://${{ env.S3_BUCKET }}/${{ env.DEPLOY_PATH }}/ \
              --delete \
              --acl public-read \
              --cache-control "max-age=0, no-cache, no-store, must-revalidate"; then
              echo "::error::Failed to sync results to S3"
              exit 1
            fi
            echo "✅ S3 sync complete."
            echo "🌐 Dashboard URL: https://${{ env.S3_BUCKET }}.s3.amazonaws.com/${{ env.DEPLOY_PATH }}/dashboard/index.html"
          else
            echo "::error::Test results directory $dir_name not found"
            echo "::error::Available directories:"
            ls -la
            exit 1
          fi

      - name: Archive static site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-html-artifact
          path: test_results_dashboard_cli_bundler          